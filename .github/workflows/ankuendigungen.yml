name: AION 2 Ankündigungen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-announcements:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: AION 2 Ankündigungen prüfen
        env:
          ANKUENDIGUNGEN_WEBHOOK: ${{ secrets.ANKUENDIGUNGEN_WEBHOOK }}
        run: python Ankuendigungen/ankuendigungen.py

      - name: Status speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Ankuendigungen/ankuendigungen_status.json; then
            echo "Keine Änderung am Status."
          else
            git add Ankuendigungen/ankuendigungen_status.json
            git commit -m "Update AION announcement status"
            git push
          fi
