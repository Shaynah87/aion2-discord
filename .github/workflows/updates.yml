name: Updates

on:
  workflow_dispatch:

jobs:
  post-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run Updates
        env:
          UPDATES_WEBHOOK_URL: ${{ secrets.UPDATES_WEBHOOK }}
        run: python Updates/updates.py
