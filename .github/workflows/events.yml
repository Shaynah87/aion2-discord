name: Halloween Events

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: halloween-events
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install pillow requests
      - name: Halloween-Event synchronisieren
        env:
          EVENTS_BOT_TOKEN: ${{ secrets.EVENTS_BOT_TOKEN }}
          EVENTS_CHANNEL_ID: ${{ secrets.EVENTS_CHANNEL_ID }}
        run: python Events/events.py

