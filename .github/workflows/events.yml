name: Events

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halloween-events
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: python -m pip install pillow requests
      - name: Halloween-Event synchronisieren
        env:
          DISCORD_BOT: ${{ secrets.DISCORD_BOT }}
          EVENTS_WEBHOOK: ${{ secrets.EVENTS_WEBHOOK }}
        run: python Events/events.py
      - name: Nachrichten-ID speichern
        if: always()
        run: |
          if ! git diff --quiet -- Events/events_message.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Events/events_message.json
            git commit -m "Update Events message IDs"
            git push
          fi
