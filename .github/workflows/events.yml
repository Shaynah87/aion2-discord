
name: Events

on:
  workflow_dispatch:
  schedule:
    # UTC-Zeiten für deutsche Sommer- und Winterzeit
    - cron: '40 6,7 * * *'
    - cron: '10 7,8 * * *'
    - cron: '10 13,14 * * *'
    - cron: '10 16,17 * * *'

permissions:
  contents: write

concurrency:
  group: halloween-events
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: python -m pip install pillow requests

      - name: Events synchronisieren
        env:
          DISCORD_BOT: ${{ secrets.DISCORD_BOT }}
          EVENTS_WEBHOOK: ${{ secrets.EVENTS_WEBHOOK }}
        run: python Events/events.py

      - name: Nachrichten-ID speichern
        if: always()
        run: |
          if ! git diff --quiet -- Events/events_message.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Events/events_message.json
            git commit -m "Update Events message IDs"
            git push
          fi
