name: AION 2 Content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prüfen ob Content aktualisiert werden soll
        id: content_time
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          MINUTE=$(TZ=Europe/Berlin date +%M)

          echo "Berlin-Zeit: ${HOUR}:${MINUTE}"
          echo "Auslöser: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manueller Start - Content wird aktualisiert."
            echo "run_content=true" >> "$GITHUB_OUTPUT"

          elif [ "$HOUR" = "00" ] && [ "$MINUTE" = "00" ]; then
            echo "Mitternacht in Berlin - Content wird aktualisiert."
            echo "run_content=true" >> "$GITHUB_OUTPUT"

          else
            echo "Nicht Mitternacht - dieser automatische Lauf wird übersprungen."
            echo "run_content=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AION 2 Content aktualisieren
        if: steps.content_time.outputs.run_content == 'true'
        env:
          CONTENT_WEBHOOK: ${{ secrets.CONTENT_WEBHOOK }}
        run: python content.py

      - name: Content-Status speichern
        if: steps.content_time.outputs.run_content == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet content_message.json; then
            echo "Keine Änderung an content_message.json."
          else
            git add content_message.json
            git commit -m "Update content message state"
            git push
          fi
