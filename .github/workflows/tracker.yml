name: AION 2 Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python installieren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: pip install Pillow

      - name: AION 2 Tracker aktualisieren
        env:
          TRACKER_WEBHOOK: ${{ secrets.TRACKER_WEBHOOK }}
        run: python Tracker/tracker.py

      - name: Tracker-Nachricht speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet Tracker/tracker_message.json; then
            echo "Keine Änderung an Tracker/tracker_message.json."
          else
            git add Tracker/tracker_message.json
            git commit -m "Update tracker message state"
            git push
          fi
