name: Kalender

on:
  workflow_dispatch:

jobs:
  build-kalender:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: pip install pillow

      - name: Kalender erstellen
        env:
          KALENDER_WEBHOOK: ${{ secrets.KALENDER_WEBHOOK }}
        run: python Kalender/kalender.py
